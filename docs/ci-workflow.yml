name: Build Android APKs

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Agency + Technician release APKs
        run: ./gradlew assembleAgencyRelease assembleTechRelease --no-daemon

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahand-apks
          path: |
            app/build/outputs/apk/agency/release/*.apk
            app/build/outputs/apk/tech/release/*.apk

      - name: Create GitHub Release with APKs (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/agency/release/*.apk
            app/build/outputs/apk/tech/release/*.apk
