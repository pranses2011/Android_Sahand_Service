<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خطای اتصال</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Vazirmatn, Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 55%, #0f172a 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; color: #e2e8f0; line-height: 2;
  }
  .card {
    background: rgba(30, 41, 59, .85); backdrop-filter: blur(10px);
    border: 1px solid rgba(148, 163, 184, .25); border-radius: 20px;
    max-width: 420px; width: 100%; padding: 34px 28px; text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  .icon { font-size: 54px; margin-bottom: 10px; }
  h1 { font-size: 19px; margin-bottom: 10px; color: #f1f5f9; }
  p { font-size: 14px; color: #94a3b8; margin-bottom: 6px; }
  .url { font-size: 12.5px; color: #64748b; direction: ltr; word-break: break-all; margin-bottom: 20px; }
  button {
    width: 100%; padding: 13px; font-size: 15.5px; font-weight: 700; font-family: inherit;
    border: 0; border-radius: 13px; cursor: pointer; color: #fff;
    background: linear-gradient(90deg, #0ea5e9, #6366f1);
  }
  button:active { opacity: .85; }
  .tips { margin-top: 22px; text-align: right; background: rgba(14, 165, 233, .08);
    border: 1px dashed rgba(14, 165, 233, .35); border-radius: 12px; padding: 12px 14px; }
  .tips span { font-size: 12.5px; color: #7dd3fc; line-height: 2.2; display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>ارتباط با سرور برقرار نشد</h1>
    <p>اتصال اینترنت یا سرور پنل سهند سرویس قطع است.</p>
    <div class="url" id="url"></div>
    <button onclick="SahandFiles.retry()">تلاش دوباره 🔄</button>
    <div class="tips">
      <span>✔ اینترنت گوشی را بررسی کنید</span>
      <span>✔ اگر سرور شما قطع است، بعد از راه‌اندازی دوباره تلاش کنید</span>
      <span>✔ در صورت تغییر آدرس سرور، از دکمه بازگشت ← تنظیمات سرور استفاده کنید</span>
    </div>
  </div>
  <script>
    try {
      var q = location.search.indexOf('?u=');
      if (q >= 0) document.getElementById('url').textContent = decodeURIComponent(location.search.substring(3));
    } catch(e) {}
  </script>
</body>
</html>
